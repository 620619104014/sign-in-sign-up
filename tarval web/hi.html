<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ani p{
            border: 2px solid red;
            width: 40%;
            animation: ani 1s linear;
            
        }
        @keyframes ani{
            from{
                transform: translateY(100%);
                opacity: 0;
            }
            to{
                transform: translateY(0%);
                opacity: 1;
            }
        }
    </style>

</head>
<body>
    <div class="ani">
        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Earum cum, debitis quibusdam deserunt rem voluptatum accusamus quo sunt enim voluptatem. Voluptas optio quae autem cum odit at officia temporibus veritatis.
        </p>
   
    </div>
</body>
</html>
